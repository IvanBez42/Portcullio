name: CI and Release

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Run Go tests
        run: go test ./...

  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run UI tests
        run: npm test

  build-and-push-images:
    needs: [go-tests, ui-tests]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize owner to lowercase for GHCR
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # main and v* tags publish :latest; dev (or a manual run on any other branch) publishes :dev
      - name: Pick image tag
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "CHANNEL=latest" >> "$GITHUB_ENV"
          else
            echo "CHANNEL=dev" >> "$GITHUB_ENV"
          fi

      # One version for both images: release or channel + short sha
      - name: Pick build version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${CHANNEL}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          build-args: PORTCULLIO_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/portcullio-agent:${{ env.CHANNEL }}
            ghcr.io/${{ env.OWNER_LC }}/portcullio-agent:${{ github.sha }}

      - name: Build and push UI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          build-args: PORTCULLIO_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/portcullio-ui:${{ env.CHANNEL }}
            ghcr.io/${{ env.OWNER_LC }}/portcullio-ui:${{ github.sha }}

  release:
    needs: [build-and-push-images]
    if: startsWith(github.ref, 'refs/tags/v') && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
