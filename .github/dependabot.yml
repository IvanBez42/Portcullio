version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/agent"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/ui"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/agent"
      - "/ui"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
